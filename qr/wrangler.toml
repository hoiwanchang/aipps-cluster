name = "qr-mint"
main = "src/index.js"
compatibility_date = "2025-08-01"

# 限流已改内存计数；PV 计数已迁 Durable Object → 本 worker 零 KV。


# --- PV counter: Durable Object (zero KV; separate 100k-ops/mo quota) ---
[durable_objects]
bindings = [{ name = "PV", class_name = "PVCounter" }]

[exports.PVCounter]
type = "durable-object"
storage = "sqlite"

[vars]
UPTIME = "2026-08-31"

# route 绑定需要 zone 级 Workers Routes:Edit 权限（当前 token 没有）。
# 拿到后取消注释；临时用子域名：qr-mint.hoiwan.workers.dev
# routes = [
#   { pattern = "qr.aipps.vip/*", zone_name = "aipps.vip" }
# ]

[triggers]
crons = ["0 12 * * *"]
